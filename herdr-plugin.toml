id = "namespace.devbox"
name = "Namespace Devbox"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Open a persistent Namespace Devbox terminal in a new Herdr tab."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "start-devbox"
title = "Open workspace Namespace Devbox"
description = "Reconnect to this workspace's default Namespace Devbox, creating it when it does not exist."
contexts = ["workspace", "pane"]
command = ["bin/herdr-namespace", "start-devbox"]

[[actions]]
id = "new-devbox"
title = "Open a new Namespace Devbox"
description = "Create a new persistent Namespace Devbox without changing this workspace's default Devbox."
contexts = ["workspace", "pane"]
command = ["bin/herdr-namespace", "new-devbox"]

[[actions]]
id = "stop-devbox"
title = "Stop workspace Namespace Devbox"
description = "Stop this workspace's default Namespace Devbox."
contexts = ["workspace", "pane"]
command = ["bin/herdr-namespace", "stop-devbox"]

[[actions]]
id = "manage-devboxes"
title = "Manage Namespace Devboxes"
description = "List and stop Namespace Devboxes in an interactive popup."
contexts = ["global", "workspace", "tab", "pane"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "namespace.devbox",
  "--entrypoint",
  "manager",
  "--placement",
  "popup",
  "--focus",
]

[[panes]]
id = "manager"
title = "Namespace Devboxes"
placement = "popup"
command = ["./bin/herdr-namespace", "manage-devboxes"]
